# Lint + test on every pull request (and pushes to main).
#
# Report-only: it exists so PRs show a red X when the build, vet, formatting or
# tests fail. Release binaries are built separately by release.yml.
#
# The job installs Go, then hands off to the Makefile: `make check` runs the
# SAME gofmt/vet/test/cross-compile steps you run locally, so CI and local can't
# drift — the detail lives in the Makefile, not this file.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint + test + cross-compile
        run: make check
