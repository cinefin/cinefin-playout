# Rolling "edge" prerelease built from the latest main.
#
# On every push to main this rebuilds the linux-amd64 and windows-amd64 archives
# (bundled mpv + a slim -nompv each, same as a tagged release), force-moves the
# `edge` git tag to the new commit, and updates the `edge` prerelease with the
# fresh assets. Archive names are stable (cinefin-playout-edge-<os>-<arch>...) so
# the download URLs never change; the binary's --version is stamped with the
# precise `git describe` (e.g. v0.8.1-3-gabc1234).
#
# Not scheduled and not manual: it always reflects the latest main. macOS is not
# built here (its tray needs a mac runner); see .github/workflows/release.yml for
# the tagged releases that include it.
name: Edge

on:
  push:
    branches: [main]

permissions:
  contents: write

# One edge build at a time; a newer push supersedes an in-flight one.
concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  edge:
    # GitHub only. Gitea can also read .github/workflows, but softprops/action-gh-release
    # targets the GitHub API; skip there so it does not error against Gitea mid-transition.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip p7zip-full xz-utils jq

      - name: Build and package
        id: build
        run: |
          set -euo pipefail
          NAME_VERSION="edge"                                   # stable archive names
          STAMP_VERSION="$(git describe --tags --always --dirty)"  # precise --version
          echo "describe=${STAMP_VERSION}" >> "${GITHUB_OUTPUT}"
          LDFLAGS="-s -w -X $(go list -m)/internal/version.Version=${STAMP_VERSION}"
          MPV_BUNDLE_URLS="$(cat mpv-bundle.json)"
          mkdir -p dist build

          # pack <name> <goos> <files...>: archive from build/ into dist/.
          pack() {
            local name="$1" goos="$2"; shift 2
            if [ "${goos}" = windows ]; then
              (cd build && zip -q "../dist/${name}.zip" "$@")
            else
              tar -czf "dist/${name}.tar.gz" -C build "$@"
            fi
          }

          # bundle_mpv <goos> <goarch> <destdir>: drop an mpv into destdir from the
          # URL configured for that target in mpv-bundle.json (if any). Recognised
          # archives are extracted; a bare binary or AppImage is taken verbatim.
          bundle_mpv() {
            local goos="$1" goarch="$2" dest="$3" key url tmp name found
            [ -n "${MPV_BUNDLE_URLS:-}" ] || return 0
            key="${goos}/${goarch}"
            url="$(echo "${MPV_BUNDLE_URLS}" | jq -r --arg k "${key}" '.[$k] // empty')"
            [ -n "${url}" ] || { echo "--- no mpv source for ${key} (ships without)"; return 0; }
            echo "--- bundling mpv for ${key} from ${url}"
            name="mpv"; [ "${goos}" = windows ] && name="mpv.exe"
            tmp=/tmp/mpvdl; rm -rf "${tmp}"; mkdir -p "${tmp}/x"
            curl -fsSL -o "${tmp}/pkg" "${url}"
            case "${url}" in
              *.7z)             7z x -y -o"${tmp}/x" "${tmp}/pkg" >/dev/null ;;
              *.zip)            unzip -q "${tmp}/pkg" -d "${tmp}/x" ;;
              *.tar.gz|*.tgz)   tar -xzf "${tmp}/pkg" -C "${tmp}/x" ;;
              *.tar.xz)         tar -xJf "${tmp}/pkg" -C "${tmp}/x" ;;
              *)                cp "${tmp}/pkg" "${tmp}/x/${name}" ;;  # bare binary or AppImage
            esac
            found="$(find "${tmp}/x" -type f -name "${name}" | head -n1)"
            [ -n "${found}" ] || { echo "mpv not found in package for ${key}"; exit 1; }
            install -m 0755 "${found}" "${dest}/${name}"
          }

          # build_variant <goos> <goarch>: cross-compile the agent (-tags ui, CGO
          # off), then archive it with the bundled mpv and as a slim -nompv.
          build_variant() {
            local goos="$1" goarch="$2"
            local ext=""; [ "${goos}" = windows ] && ext=".exe"
            local ldflags="${LDFLAGS}"
            [ "${goos}" = windows ] && ldflags="${ldflags} -H windowsgui"
            rm -rf build/*
            local name="cinefin-playout-${NAME_VERSION}-${goos}-${goarch}"
            echo "=== ${name}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -tags ui -ldflags "${ldflags}" -o "build/cinefin-playout${ext}" ./cmd/cinefin-playout
            bundle_mpv "${goos}" "${goarch}" build
            local mpvfile=""
            [ -f "build/mpv" ]     && mpvfile="mpv"
            [ -f "build/mpv.exe" ] && mpvfile="mpv.exe"
            if [ -n "${mpvfile}" ]; then
              pack "${name}"       "${goos}" "cinefin-playout${ext}" "${mpvfile}"
              pack "${name}-nompv" "${goos}" "cinefin-playout${ext}"
            else
              pack "${name}" "${goos}" "cinefin-playout${ext}"
            fi
          }

          for target in linux/amd64 windows/amd64; do
            build_variant "${target%/*}" "${target#*/}"
          done
          ls -la dist/

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Move the edge tag to this commit
        run: |
          git tag -f edge
          git push -f origin edge

      - name: Publish the edge prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: Edge (latest main)
          prerelease: true
          make_latest: false
          body: |
            Rolling prerelease built from the latest `main` (${{ github.sha }}).
            Version `${{ steps.build.outputs.describe }}`.

            Linux and Windows (amd64) only. Each target has a bundled-mpv archive
            and a slim `-nompv` archive. This is not a stable release; for those,
            see the tagged releases.

            Verify with `sha256sum -c SHA256SUMS.txt`.
          files: dist/*
          fail_on_unmatched_files: true
