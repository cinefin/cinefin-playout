# Build and publish the agent binaries.
#
#   push to main    -> rolling "edge" PRE-RELEASE: linux-amd64 + windows-amd64
#   push tag vX.Y.Z -> STABLE release: linux-amd64 only (mac built on a Mac by hand)
#   manual run      -> builds, publishes nothing
#
# Windows is EDGE-ONLY on purpose: the windows-amd64 archive ships on the rolling
# edge pre-release for testing, never on a tagged stable release yet.
#
# The version is the git tag, stamped via ldflags (`go list -m` resolves the
# module path) — no file is hand-edited. Each binary is built with -tags ui (pure
# Go, CGO off): a system tray when interactive, headless under --no-ui.
#
# Each archive can ship an `mpv` alongside the agent (sources in mpv-bundle.json,
# keyed by "<goos>/<goarch>"); a slim "-nompv" archive is also produced for hosts
# that bring their own mpv. Assets are ARCHIVES (.tar.gz / .zip) on purpose:
# compression halves the download and keeps one file per target.
#
# macOS is not cross-built (its tray needs cgo/Cocoa): build the .app on a Mac
# with scripts/build-macos-app.sh and attach it to the release by hand.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install packaging tools
        # Pure-Go (CGO off), so there is no build toolchain to install — just the
        # archivers used to unpack the bundled mpv downloads and jq for the bundle.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip p7zip-full xz-utils jq

      - name: Work out version, channel and targets
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Stable release: linux only. Windows is edge-only; mac built by hand.
            version="${GITHUB_REF_NAME}"; channel="release"
            targets="linux/amd64"
          else
            # Edge: rolling build of main — carries the Windows archive too.
            version="$(git describe --tags --always --dirty 2>/dev/null || echo edge)"
            channel="edge"
            targets="linux/amd64 windows/amd64"
          fi
          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "targets=${targets}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version} channel=${channel} targets=${targets}"

      - name: Build and package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGETS: ${{ steps.meta.outputs.targets }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X $(go list -m)/internal/version.Version=${VERSION}"
          MPV_BUNDLE_URLS="$(cat mpv-bundle.json)"
          mkdir -p dist build

          # pack <name> <goos> <files...>: archive from build/ into dist/.
          pack() {
            local name="$1" goos="$2"; shift 2
            if [ "${goos}" = windows ]; then
              (cd build && zip -q "../dist/${name}.zip" "$@")
            else
              tar -czf "dist/${name}.tar.gz" -C build "$@"
            fi
          }

          # bundle_mpv <goos> <goarch> <destdir>: drop an mpv into destdir from the
          # URL configured for that target in mpv-bundle.json (if any).
          bundle_mpv() {
            local goos="$1" goarch="$2" dest="$3" key url tmp name found
            [ -n "${MPV_BUNDLE_URLS:-}" ] || return 0
            key="${goos}/${goarch}"
            url="$(echo "${MPV_BUNDLE_URLS}" | jq -r --arg k "${key}" '.[$k] // empty')"
            [ -n "${url}" ] || { echo "--- no mpv source for ${key} (ships without)"; return 0; }
            echo "--- bundling mpv for ${key} from ${url}"
            name="mpv"; [ "${goos}" = windows ] && name="mpv.exe"
            tmp=/tmp/mpvdl; rm -rf "${tmp}"; mkdir -p "${tmp}/x"
            curl -fsSL -o "${tmp}/pkg" "${url}"
            case "${url}" in
              *.7z)             7z x -y -o"${tmp}/x" "${tmp}/pkg" >/dev/null ;;
              *.zip)            unzip -q "${tmp}/pkg" -d "${tmp}/x" ;;
              *.tar.gz|*.tgz)   tar -xzf "${tmp}/pkg" -C "${tmp}/x" ;;
              *.tar.xz)         tar -xJf "${tmp}/pkg" -C "${tmp}/x" ;;
              *)                cp "${tmp}/pkg" "${tmp}/x/${name}" ;;  # bare binary or AppImage
            esac
            found="$(find "${tmp}/x" -type f -name "${name}" | head -n1)"
            [ -n "${found}" ] || { echo "mpv not found in package for ${key}"; exit 1; }
            install -m 0755 "${found}" "${dest}/${name}"
          }

          # build_variant <goos> <goarch>: cross-compile the agent (-tags ui, CGO
          # off), then archive it with the bundled mpv and as a slim -nompv.
          build_variant() {
            local goos="$1" goarch="$2"
            local ext=""; [ "${goos}" = windows ] && ext=".exe"
            local ldflags="${LDFLAGS}"
            # On Windows build a GUI app so double-clicking shows no console window;
            # it still runs headless under --no-ui.
            [ "${goos}" = windows ] && ldflags="${ldflags} -H windowsgui"
            rm -rf build/*
            local name="cinefin-playout-${VERSION}-${goos}-${goarch}"
            echo "=== ${name}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -tags ui -ldflags "${ldflags}" -o "build/cinefin-playout${ext}" ./cmd/cinefin-playout
            bundle_mpv "${goos}" "${goarch}" build
            local mpvfile=""
            [ -f "build/mpv" ]     && mpvfile="mpv"
            [ -f "build/mpv.exe" ] && mpvfile="mpv.exe"
            if [ -n "${mpvfile}" ]; then
              pack "${name}"       "${goos}" "cinefin-playout${ext}" "${mpvfile}"
              pack "${name}-nompv" "${goos}" "cinefin-playout${ext}"
            else
              pack "${name}" "${goos}" "cinefin-playout${ext}"
            fi
          }

          for target in ${TARGETS}; do
            build_variant "${target%/*}" "${target#*/}"
          done
          ls -la dist/

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Build the release notes
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          BODY="${RUNNER_TEMP}/body.txt"
          if [ "${CHANNEL}" = "release" ]; then
            {
              echo "## Changes"
              echo
              # scripts/changelog.sh is the SHARED source of truth for the notes —
              # byte-identical to cinefin and to the Gitea release workflow.
              scripts/changelog.sh "${GITHUB_REF_NAME}"
              echo
              echo "## Binaries"
              echo
              echo "\`.tar.gz\` for linux-amd64. The agent shows a system tray when run"
              echo "interactively and runs headless with \`--no-ui\` (the systemd unit / a"
              echo "Windows service)."
              echo
              echo "Each archive bundles \`mpv\`, so there is nothing else to install. Prefer"
              echo "your own mpv? Take the matching \`-nompv\` archive; the agent then uses"
              echo "\`[mpv].binary\` or an mpv on PATH."
              echo
              echo "macOS: build the desktop \`.app\` on a Mac with \`scripts/build-macos-app.sh\`"
              echo "and attach it here. Windows ships on the \`edge\` pre-release for now."
              echo
              echo "Verify with \`sha256sum -c SHA256SUMS.txt\`."
            } > "${BODY}"
          else
            base="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
            {
              echo "Rolling build of the latest \`main\` (\`${GITHUB_SHA::8}\`) — unstable."
              echo
              echo "Includes linux-amd64 and windows-amd64 archives (each with and without a"
              echo "bundled \`mpv\`). Verify with \`sha256sum -c SHA256SUMS.txt\`."
              echo
              echo "## Pending changes${base:+ since ${base}}"
              echo
              # changelog.sh with a ref (not a tag) lists commits since the latest tag.
              scripts/changelog.sh HEAD 20
            } > "${BODY}"
          fi
          echo "----- release notes -----"; cat "${BODY}"

      - name: Publish (stable release on a tag / rolling edge on main)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "${CHANNEL}" = "release" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${RUNNER_TEMP}/body.txt" \
              dist/*
          else
            gh release delete edge --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            gh release create edge \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false \
              --target "$GITHUB_SHA" \
              --title "Latest dev build (edge)" \
              --notes-file "${RUNNER_TEMP}/body.txt" \
              dist/*
          fi
